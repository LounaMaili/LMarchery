name: Vision lab Python

on:
  pull_request:
    paths:
      - 'vision-lab/**'
      - '.github/workflows/vision-lab.yml'
  push:
    branches:
      - main
    paths:
      - 'vision-lab/**'
      - '.github/workflows/vision-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vision-lab
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up exact Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.2'
      - name: Verify and install pinned wheels
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.txt
      - name: Unit tests
        run: python -m unittest -v
      - name: Regenerate frozen R1 references and verify partitions and results
        run: python verify_r1.py "$RUNNER_TEMP/vision-r1"

  r3-cpu:
    name: R3 model CPU tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vision-lab
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up exact Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.2'
      - name: Verify and install CPU wheels
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.txt
          python -m pip install --only-binary=:all: --require-hashes \
            --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-r3-cpu.txt
          python -m pip install --only-binary=:all: --require-hashes --no-deps \
            --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-r8-cpu.txt
      - name: Three required R7 learning tests
        run: |
          python - <<'PYTEST'
          import unittest
          from test_r7 import LearningTests
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(LearningTests)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          executed = result.testsRun - len(result.skipped)
          passed = executed - len(result.errors) - len(result.failures)
          print(f"Executed {executed}, passed {passed}, skipped {len(result.skipped)}")
          if result.testsRun != 3 or result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PYTEST
      - name: Model, window fusion and decoder tests
        run: python -m unittest -v test_r3.LearningTests test_r6 test_r8 test_r9
      - name: Required R19 partial supervision tests
        run: |
          python - <<'PYTEST'
          import unittest
          from test_r19 import ApprentissageR19
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(ApprentissageR19)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 4 or result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PYTEST
      - name: Required R20 loss instrumentation test
        run: |
          python - <<'PYTEST'
          import unittest
          from test_r20_cpu import CoutsR20
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromTestCase(CoutsR20))
          if result.testsRun != 1 or result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PYTEST
      - name: Required R21 presence and partial supervision tests
        run: |
          python - <<'PYTEST'
          import unittest
          from test_r21_cpu import PresenceR21
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromTestCase(PresenceR21))
          if result.testsRun != 4 or result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PYTEST
